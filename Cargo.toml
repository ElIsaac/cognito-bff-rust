[workspace]
resolver = "3"
# `crates/*` no sirve: crates/adapters es un directorio sin Cargo.toml. Al agregar un crate
# de primer nivel (p. ej. lambda) hay que listarlo aqui.
members = ["crates/domain", "crates/application", "crates/workspace-tests", "crates/adapters/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/ElIsaac/cognito-bff-rust"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
base64 = "0.23.1"
cargo_metadata = "0.23.1"
proptest = "1.11.0"
secrecy = "0.10.3"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", default-features = false }
tracing = "0.1.44"
url = "2.5.8"
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
