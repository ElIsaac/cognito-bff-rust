[workspace]
resolver = "3"
# Cuando exista el primer adaptador, agregar "crates/adapters/*": cargo falla si el glob no
# coincide con ningun directorio, asi que hoy no puede estar. El test de arquitectura
# (crates/workspace-tests) ya clasifica por ruta los crates bajo crates/adapters/.
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/ElIsaac/cognito-bff-rust"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
base64 = "0.23.1"
cargo_metadata = "0.23.1"
proptest = "1.11.0"
secrecy = "0.10.3"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.21"
url = "2.5.8"
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
